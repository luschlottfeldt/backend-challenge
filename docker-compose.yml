name: wagering-processor

x-app-env: &app-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: wagering
  DB_PASSWORD: wagering
  DB_NAME: wagering
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_SQS_ENDPOINT: http://localstack:4566
  SQS_WAGER_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
  SQS_WAGER_TRANSACTIONS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
  SQS_INTEGRATION_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/integration-events.fifo
  SQS_INTEGRATION_EVENTS_DLQ_URL: http://localstack:4566/000000000000/integration-events-dlq.fifo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init:/etc/localstack/init/ready.d
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["app"]
    build:
      context: .
      target: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
    command: ["bun", "run", "migration:up"]
    restart: "no"

  app:
    profiles: ["app"]
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    deploy:
      replicas: 3

  gateway:
    profiles: ["app"]
    image: nginx:1.27-alpine
    depends_on:
      - app
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3000:80"

volumes:
  postgres_data:
  localstack_data:
